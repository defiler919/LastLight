[CommonSettings]
SourcePath=Content/Localization/Darkwell
DestinationPath=Content/Localization/Darkwell
ManifestName=Darkwell.manifest
ArchiveName=Darkwell.archive
PortableObjectName=Darkwell.po
ResourceName=Darkwell.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

; Gather native runtime text.
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/Darkwell/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

; Gather FText fields owned by item and recipe assets.
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/Data/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.uasset
bFixBroken=false
ShouldGatherFromEditorOnlyData=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

; Import translator-authored PO files before compiling the runtime resource.
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
